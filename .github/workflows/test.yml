name: Test

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install bats and just
        run: sudo apt-get install -y bats just

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: just test
